quarkus.http.port=8000
quarkus.http.host=0.0.0.0
quarkus.banner.enabled=false
quarkus.shutdown.timeout=10s

djclass.sqlite-path=${SQLITE_PATH:djclass.sqlite3}
djclass.dev=${DEV:0}

# Same layout as internal/store: one write connection, a query_only read pool.
# sqlite-jdbc reads the pragmas from URL parameters. No JTA: writeTx is plain JDBC.
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${djclass.sqlite-path}?journal_mode=WAL&synchronous=NORMAL&foreign_keys=true&busy_timeout=5000&transaction_mode=IMMEDIATE
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.acquisition-timeout=30s
quarkus.datasource.jdbc.transactions=disabled

quarkus.datasource."read".db-kind=sqlite
quarkus.datasource."read".jdbc.url=jdbc:sqlite:${djclass.sqlite-path}?foreign_keys=true&busy_timeout=5000
quarkus.datasource."read".jdbc.min-size=4
quarkus.datasource."read".jdbc.max-size=4
quarkus.datasource."read".jdbc.new-connection-sql=PRAGMA query_only=1
quarkus.datasource."read".jdbc.transactions=disabled

quarkus.flyway.migrate-at-start=true

quarkus.smallrye-health.root-path=/healthz

# Security headers (internal/web/middleware.go)
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; img-src 'self' data: https://*.pstatic.net https://*.naver.net; frame-ancestors 'none'; base-uri 'none'; form-action 'self'
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=same-origin
quarkus.http.header."Cross-Origin-Opener-Policy".value=same-origin
quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=()
