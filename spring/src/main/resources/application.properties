spring.application.name=djclass
server.port=8000
# Go: one goroutine per request -> Java 21+: one virtual thread per request
spring.threads.virtual.enabled=true
# Tomcat uses connectionTimeout as the blocking read/write timeout (~ Go's per-write deadline)
server.tomcat.connection-timeout=10s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
djclass.sqlite-path=${SQLITE_PATH:djclass.sqlite3}
djclass.dev=${DEV:false}
spring.flyway.locations=classpath:db/migration
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthz
spring.thymeleaf.cache=true
spring.main.banner-mode=off
